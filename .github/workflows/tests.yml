name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 准备测试配置
        # 测试全程使用替身，不发起真实网络请求，因此这里用占位凭据即可
        run: cp .env.test .env

      - name: 运行测试
        run: python -m pytest -q
