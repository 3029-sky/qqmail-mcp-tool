<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-label="信使鸟：衔着信封的鸟">
  <!--
    信使鸟 · 邮件管家的标识

    原创设计，刻意不与任何已注册角色相似：
      · 不是什么特定作品的鸟，而是「会送信的鸟」这个通用意象
      · 靠三样东西表意：鸟、信封、信使包
      · 配色取自本程序界面的强调色，保证与 UI 同色系

    视觉结构（从下往上）：
      信使包（左下）-> 信封 -> 鸟身 -> 头 -> 喙与信
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#2b5aa8"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbcff"/>
      <stop offset="1" stop-color="#3f6fd0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6f2"/>
    </linearGradient>
  </defs>

  <!-- ========== 信使包（斜挎，暗示「信使」身份） ========== -->
  <g>
    <path d="M20 88 h34 a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 H20 a4 4 0 0 1 -4 -4 V92 a4 4 0 0 1 4 -4 z"
          fill="#e8a33d"/>
    <path d="M24 88 v-6 a13 13 0 0 1 26 0 v6" fill="none"
          stroke="#c9821f" stroke-width="4" stroke-linecap="round"/>
    <rect x="30" y="99" width="14" height="9" rx="2" fill="#c9821f"/>
  </g>

  <!-- ========== 尾巴 ========== -->
  <path d="M22 66 L4 82 L22 86 Z" fill="url(#wing)"/>

  <!-- ========== 身体 ========== -->
  <ellipse cx="58" cy="70" rx="30" ry="28" fill="url(#body)"/>

  <!-- ========== 翅膀 ========== -->
  <path d="M46 52 q26 6 30 30 q-20 6 -30 -30 z" fill="url(#wing)"/>

  <!-- ========== 头 ========== -->
  <circle cx="76" cy="42" r="24" fill="url(#body)"/>

  <!-- 眼睛：一颗实心点，简洁不拟人 -->
  <circle cx="83" cy="38" r="4.6" fill="#12203a"/>
  <circle cx="84.6" cy="36.4" r="1.6" fill="#ffffff" opacity=".9"/>

  <!-- ========== 喙 ========== -->
  <path d="M98 40 L118 46 L98 52 Z" fill="#f0b445"/>
  <path d="M98 46 L118 46 L98 52 Z" fill="#d9942a"/>

  <!-- ========== 衔着的信封（核心表意元素） ========== -->
  <g transform="rotate(-12 104 60)">
    <rect x="86" y="52" width="34" height="24" rx="3" fill="url(#paper)"
          stroke="#b9c4d6" stroke-width="1.5"/>
    <!-- 信封的折线 -->
    <path d="M87 54 L103 66 L119 54" fill="none" stroke="#8f9db5"
          stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- ========== 脚 ========== -->
  <path d="M50 96 v8 M50 104 h-7 M50 104 h7" stroke="#c9821f" stroke-width="3.4"
        stroke-linecap="round" fill="none"/>
  <path d="M66 96 v8 M66 104 h-7 M66 104 h7" stroke="#c9821f" stroke-width="3.4"
        stroke-linecap="round" fill="none"/>
</svg>
